<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SPARQL queries · ZORRO</title>
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <header>
      <a class="brand" href="query.html">ZORRO</a>
      <nav aria-label="Main navigation">
        <a href="overview.html">Demonstrator</a>
        <a href="query.html" aria-current="page">SPARQL queries</a>
        <a href="builder.html">Query builder</a>
        <a href="graph.html">Knowledge graph</a>
        <a href="ontology.html">Ontology</a>
      </nav>
    </header>
    <main>
      <div class="query-layout">
        <aside class="panel">
          <h2>Example questions</h2>
          <div id="examples">Loading examples…</div>
        </aside>
        <section class="panel">
          <details class="query-context" id="query-context" open>
            <summary>Example context</summary>
            <div id="context-content"></div>
            <p id="context-edited" hidden>
              Query edited. The explanation refers to the selected example.
            </p>
          </details>
          <div class="query-editor" id="query-editor">
            <div class="editor-toolbar">
              <label for="query">SPARQL query</label>
              <span id="editor-mode" role="status">Read-only example</span>
              <button class="secondary" id="edit" disabled aria-pressed="false">
                Try it yourself
              </button>
            </div>
            <p id="editor-hint" hidden>
              Editing enabled. Change the query below, then select Run query.
            </p>
            <textarea
              id="query"
              spellcheck="false"
              rows="18"
              readonly
              aria-readonly="true"
              aria-describedby="editor-mode editor-hint"
            ></textarea>
          </div>
          <div class="actions">
            <button id="run" disabled>Run query</button>
            <button class="secondary" id="reset" disabled>Reset example</button>
            <button class="secondary" id="download" disabled>
              Download CSV
            </button>
          </div>
          <p id="status" role="status">Loading query engine…</p>
          <div class="results" id="results"></div>
        </section>
      </div>
    </main>
    <script src="https://rdf.js.org/comunica-browser/versions/v4/engines/query-sparql/comunica-browser.js"></script>
    <script src="query-runner.js" defer></script>
    <script src="query.js?v=2" defer></script>
  </body>
</html>
